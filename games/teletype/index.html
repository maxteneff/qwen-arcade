<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teletype 1970 · Qwen Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23111'/></svg>">
  <style>
    :root {
      --bg: #050a06;
      --fg: #57e88f;
      --bright: #8dffb5;
      --dim: #2e8f57;
      --faint: #1c5c38;
      --warn: #ffd24a;
      --crit: #ff7a5c;
      --line: #14402a;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-shadow: 0 0 6px rgba(87, 232, 143, 0.35);
      overflow: hidden;
    }

    .crt {
      position: relative;
      width: 100%;
      max-width: 1060px;
      height: 100vh;
      max-height: 860px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border-left: 1px solid #0d1f14;
      border-right: 1px solid #0d1f14;
      background: radial-gradient(ellipse at 50% 0%, #0a1a10 0%, var(--bg) 62%);
    }

    .crt::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0) 4px
      );
      mix-blend-mode: multiply;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 10px 18px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      user-select: none;
    }

    .top .title { color: var(--bright); font-weight: 700; letter-spacing: 0.08em; }
    .top .link { color: var(--dim); text-decoration: none; text-shadow: none; }
    .top .link:hover { color: var(--fg); }
    .top .clock { color: var(--bright); white-space: nowrap; }
    .top .turn { color: var(--warn); }

    .meters {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 6px 22px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
      user-select: none;
    }

    .meter { display: flex; justify-content: space-between; gap: 10px; white-space: pre; }
    .meter .k { color: var(--bright); }
    .bar { letter-spacing: 0.04em; }
    .bar.ok { color: var(--fg); }
    .bar.warn { color: var(--warn); }
    .bar.crit { color: var(--crit); text-shadow: 0 0 8px rgba(255, 122, 92, 0.5); }
    .num { color: var(--bright); }

    .sectors { grid-column: 4 / 5; padding-left: 18px; border-left: 1px solid var(--line); font-size: 12px; line-height: 1.7; }
    .sectors .s { white-space: pre; }
    .sectors .ok { color: var(--fg); }
    .sectors .bad { color: var(--crit); }

    #feed {
      padding: 12px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.55;
    }

    #feed .ln { white-space: pre-wrap; word-break: break-word; }
    #feed .sys { color: var(--dim); }
    #feed .evt { color: #b7ffd1; }
    #feed .me { color: var(--bright); }
    #feed .res { color: var(--warn); }
    #feed .err { color: var(--crit); }
    #feed .good { color: #b7ffd1; }
    #feed .div { color: var(--faint); margin: 6px 0; }
    #feed .head { color: var(--bright); font-weight: 700; letter-spacing: 0.06em; }

    .prompt {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 10px 18px 14px;
      border-top: 1px solid var(--line);
      font-size: 13.5px;
    }

    .prompt .p { color: var(--bright); white-space: nowrap; }

    .prompt input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font: inherit;
      text-shadow: inherit;
      caret-color: var(--bright);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5, 10, 6, 0.94);
      text-align: center;
      padding: 24px;
      z-index: 10;
    }

    .overlay.hidden { display: none; }
    .overlay .big { font-size: 26px; font-weight: 700; letter-spacing: 0.1em; color: var(--bright); }
    .overlay .big.lose { color: var(--crit); text-shadow: 0 0 10px rgba(255, 122, 92, 0.5); }
    .overlay .sub { font-size: 13px; color: var(--fg); max-width: 560px; line-height: 1.7; }
    .overlay .stats { font-size: 12px; color: var(--dim); }
    .overlay button {
      font: 700 13px ui-monospace, monospace;
      letter-spacing: 0.08em;
      padding: 10px 26px;
      color: var(--bg);
      background: var(--bright);
      border: none;
      cursor: pointer;
      text-shadow: none;
    }
    .overlay button:hover { background: #bffcd0; }

    .history { display: none; }

    @media (max-width: 820px) {
      .meters { grid-template-columns: 1fr; }
      .sectors { grid-column: 1 / 2; border-left: none; border-top: 1px solid var(--line); padding: 8px 0 0; margin-top: 4px; }
      body { overflow: auto; }
      .crt { height: auto; max-height: none; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="crt">
    <div class="top">
      <span>
        <a class="link" href="../../">&larr; ALL GAMES</a>
        &nbsp;&nbsp;<span class="title">TELETYPE CONSOLE — STATION K-7</span>
      </span>
      <span class="clock"><span class="turn" id="turn">SHIFT 00</span> &middot; <span id="clock">23:20</span> &middot; NEXT REPORT <span id="tt">--:--</span></span>
    </div>

    <div class="meters">
      <div class="meter"><span class="k">POWER</span><span class="bar ok" id="b-power"></span><span class="num" id="n-power"></span></div>
      <div class="meter"><span class="k">HEAT</span><span class="bar ok" id="b-heat"></span><span class="num" id="n-heat"></span></div>
      <div class="meter"><span class="k">CALM</span><span class="bar ok" id="b-calm"></span><span class="num" id="n-calm"></span></div>
      <div class="sectors" id="sectors"></div>
    </div>

    <div id="feed"></div>

    <div class="prompt">
      <span class="p">OPERATOR&gt;</span>
      <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="HELP">
    </div>

    <div class="overlay hidden" id="overlay">
      <div class="big" id="ov-title"></div>
      <div class="sub" id="ov-sub"></div>
      <div class="stats" id="ov-stats"></div>
      <button id="ov-btn">TAKE THE SHIFT AGAIN</button>
    </div>
  </div>

  <script>
    "use strict";

    const MAX_TURN = 12;
    const TURN_MS = 45000;
    const FIRST_DELAY = 6000;
    const TURN_MINUTES = 25;
    const START_MIN = 23 * 60 + 20;

    const SECTORS = [
      { id: "ref", code: "REF-1", name: "REFINERY" },
      { id: "lab", code: "LAB-2", name: "REACTOR LAB" },
      { id: "dwl", code: "DWL-3", name: "DWELLING" },
      { id: "out", code: "OUT-4", name: "OUTPOST" },
    ];
    const SECTOR_ALIASES = {
      "REF": "ref", "REF1": "ref", "REF-1": "ref", "REFINERY": "ref",
      "LAB": "lab", "LAB2": "lab", "LAB-2": "lab", "REACTOR": "lab",
      "DWL": "dwl", "DWL3": "dwl", "DWL-3": "dwl", "DWELLING": "dwl", "DWELL": "dwl",
      "OUT": "out", "OUT4": "out", "OUT-4": "out", "OUTPOST": "out",
    };

    const EVENTS = [
      {
        id: "trip", w: 14, good: false, needsOK: ["ref"],
        text: "GEN-2 TRIPE — REFINERY BUS DE-ENERGISED",
        apply(s) { s.power -= 10; setSector("ref", "OFFLINE"); },
      },
      {
        id: "frost", w: 14, good: false, needsOK: ["dwl"],
        text: "FROST BREACH — DWELLING WING B",
        apply(s) { s.heat -= 12; s.calm -= 8; setSector("dwl", "BREACH"); },
      },
      {
        id: "core", w: 12, good: false, needsOK: ["lab"],
        text: "LAB REACTOR AT 98% — VENT REQUIRED",
        apply(s) { setSector("lab", "OVERHEAT"); },
      },
      {
        id: "quake", w: 12, good: false, needsOK: ["out"],
        text: "SEISMIC SHAKE E-2 — OUTPOST LOST SIGNAL",
        apply(s) { s.calm -= 6; setSector("out", "OFFLINE"); },
      },
      {
        id: "riot", w: 12, good: false, needsOK: [],
        text: "RATIONS SHORT — PLUNDER IN DWELLING",
        apply(s) { s.calm -= 16; },
      },
      {
        id: "gale", w: 9, good: false, needsOK: [],
        text: "GALE 83 KM/H — HEAT LOSS ACCELERATING",
        apply(s) { s.heat -= 8; },
      },
      {
        id: "tracks", w: 7, good: false, needsOK: ["out"],
        text: "UNIDENTIFIED TRACKS — OUTPOST PERIMETER",
        apply(s) { s.calm -= 10; setSector("out", "BREACH"); },
      },
      {
        id: "supply", w: 12, good: true, needsOK: [],
        text: "SUPPLY LORRY THROUGH THE PASS — +FUEL",
        apply(s) { s.power += 16; },
      },
      {
        id: "tech", w: 9, good: true, needsOK: [],
        text: "TECH RECOVERS SPARE VALVE — LAB STABILISED",
        apply(s) { setSector("lab", "OK"); s.power += 4; },
      },
    ];

    const RESCUE_COST = 15, POWER_COST = 12, VENT_COST = 8, BROADCAST_COST = 10;

    let G, nextTurnAt, turnTimer, clockTimer;

    const feedEl = document.getElementById("feed");
    const cmdEl = document.getElementById("cmd");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ov-title");
    const ovSub = document.getElementById("ov-sub");
    const ovStats = document.getElementById("ov-stats");

    function clamp(v) { return Math.max(0, Math.min(100, v)); }

    function reset() {
      G = {
        power: 70,
        heat: 70,
        calm: 80,
        turn: 0,
        startMin: START_MIN,
        sectors: { ref: "OK", lab: "OK", dwl: "OK", out: "OK" },
        over: false,
        actions: 0,
        incidents: 0,
        startedAt: Date.now(),
        endedAt: 0,
      };
      if (clockTimer) clearInterval(clockTimer);
      if (turnTimer) clearTimeout(turnTimer);
      overlay.classList.add("hidden");
      feedEl.innerHTML = "";
      cmdEl.value = "";
      boot();
      render();
      scheduleTurn(FIRST_DELAY);
      clockTimer = setInterval(tickClock, 1000);
    }

    function scheduleTurn(delay) {
      if (turnTimer) clearTimeout(turnTimer);
      nextTurnAt = Date.now() + delay;
      turnTimer = setTimeout(endTurn, delay);
    }

    function clockStr() {
      const m = (G.startMin + G.turn * TURN_MINUTES) % 1440;
      return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    }

    function tickClock() {
      const left = Math.max(0, Math.ceil((nextTurnAt - Date.now()) / 1000));
      const m = Math.floor(left / 60);
      const s = left % 60;
      document.getElementById("tt").textContent =
        G.over ? "--:--" : (G.turn >= MAX_TURN ? "00:00" : (m + ":" + String(s).padStart(2, "0")));
    }

    function print(text, cls) {
      const ln = document.createElement("div");
      ln.className = "ln" + (cls ? " " + cls : "");
      ln.textContent = text;
      feedEl.appendChild(ln);
      feedEl.scrollTop = feedEl.scrollHeight;
    }

    function stamp() {
      return "[" + clockStr() + "]";
    }

    function setSector(id, state) {
      G.sectors[id] = state;
    }

    function sectorById(id) {
      return SECTORS.find((s) => s.id === id);
    }

    function brokenSectors() {
      return SECTORS.filter((s) => G.sectors[s.id] !== "OK");
    }

    function bar(v, label) {
      const filled = Math.round(clamp(v) / 10);
      const chars = "█".repeat(filled) + "░".repeat(10 - filled);
      const cls = v < 25 ? "crit" : v < 50 ? "warn" : "ok";
      return { chars, cls };
    }

    function render() {
      const defs = [
        ["power", G.power],
        ["heat", G.heat],
        ["calm", G.calm],
      ];
      for (const [k, v] of defs) {
        const b = bar(v, k);
        const el = document.getElementById("b-" + k);
        el.textContent = b.chars;
        el.className = "bar " + b.cls;
        document.getElementById("n-" + k).textContent = String(clamp(v)).padStart(3, "0") + "/100";
      }
      const se = document.getElementById("sectors");
      se.innerHTML = "";
      SECTORS.forEach((s) => {
        const state = G.sectors[s.id];
        const row = document.createElement("div");
        row.className = "s " + (state === "OK" ? "ok" : "bad");
        row.textContent = s.code + "  " + s.name.padEnd(14, " ") + "  [" + state + "]";
        se.appendChild(row);
      });
      document.getElementById("turn").textContent = "SHIFT " + String(G.turn).padStart(2, "0");
      document.getElementById("clock").textContent = clockStr();
    }

    function applyEvent(ev) {
      ev.apply(G);
      if (!ev.good) G.incidents += 1;
      if (ev.good) {
        print(stamp() + "  REPORT: " + ev.text, "good");
      } else {
        print(stamp() + "  !! REPORT: " + ev.text, "evt");
      }
    }

    function pickEvent() {
      const pool = EVENTS.filter((ev) => {
        if (!ev.needsOK || !ev.needsOK.length) return true;
        return ev.needsOK.every((id) => G.sectors[id] === "OK");
      });
      const bad = pool.filter((e) => !e.good);
      const good = pool.filter((e) => e.good);
      const wantGood = G.turn > 1 && Math.random() < 0.25;
      const candidates = (wantGood ? good : bad).length ? (wantGood ? good : bad) : pool;
      const total = candidates.reduce((a, e) => a + e.w, 0);
      let r = Math.random() * total;
      for (const e of candidates) {
        r -= e.w;
        if (r <= 0) return e;
      }
      return candidates[candidates.length - 1];
    }

    function passive() {
      if (G.sectors.ref === "OK") G.power += 10; else G.power -= 8;
      G.heat -= 4;
      G.calm -= 2;
      brokenSectors().forEach((s) => {
        const st = G.sectors[s.id];
        if (st === "OVERHEAT") {
          G.power -= 6;
          print(stamp() + "  " + s.code + " OVERHEAT ESCALATING — POWER BLEED -6", "res");
        }
        if (st === "BREACH") {
          G.heat -= 6;
          print(stamp() + "  " + s.code + " BREACH ESCALATING — HEAT LOSS -6", "res");
        }
        G.calm -= 5;
      });
    }

    function checkDefeat() {
      if (G.over) return;
      if (G.power <= 0) return defeat("BLACKOUT",
        "The station dies in the dark. The last thing the recorder catches is someone switching off the radio — gently, so it would last the longest.");
      if (G.heat <= 0) return defeat("FROST",
        "The first frost comes in through the dwelling wing. By 02:00 the heat meters read exactly the same as the air outside.");
      if (G.calm <= 0) return defeat("MUTINY",
        "At 01:37 the dwelling opens its doors and the population walks out into the snow. Nobody shouts. That is the worst part.");
    }

    function endTurn() {
      if (G.over) return;
      G.turn += 1;
      print("", "div");
      print("── SHIFT " + String(G.turn).padStart(2, "0") + " · " + clockStr() + " ─────────────────────────────", "div");
      render();

      if (G.turn >= MAX_TURN) {
        victory();
        return;
      }

      passive();
      applyEvent(pickEvent());
      render();
      checkDefeat();
      if (G.over) return;
      scheduleTurn(TURN_MS);
      tickClock();
    }

    function checkCost(cost) {
      if (G.power < cost) {
        print(stamp() + "  DENIED — RESERVE POWER " + Math.max(0, G.power - cost) + " BELOW " + cost + " THRESHOLD", "err");
        return false;
      }
      G.power -= cost;
      return true;
    }

    function doPower(id) {
      if (G.sectors[id] === "OK") {
        print(stamp() + "  " + id.toUpperCase() + " ALREADY ONLINE. ROUTE UNNECESSARY.", "res");
        return;
      }
      if (G.sectors[id] === "BREACH") {
        print(stamp() + "  " + id.toUpperCase() + " IN BREACH — ROUTE POWER WILL NOT HOLD. SEND RESCUE FIRST.", "err");
        return;
      }
      if (!checkCost(POWER_COST)) return;
      setSector(id, "OK");
      G.heat += 4;
      G.calm += 4;
      print(stamp() + "  POWER RESTORED TO " + sectorById(id).code + " — " + sectorById(id).name + " BACK ONLINE", "good");
    }

    function doRescue(id) {
      if (G.sectors[id] !== "BREACH") {
        print(stamp() + "  " + id.toUpperCase() + " HAS NO ACTIVE BREACH. RESCUE NOT ROUTED.", "res");
        return;
      }
      if (!checkCost(RESCUE_COST)) return;
      setSector(id, "OK");
      G.calm += 12;
      G.heat += 4;
      print(stamp() + "  RESCUE TEAM INSIDE " + sectorById(id).code + " — BREACH SEALED, INHABITANTS STABLE", "good");
    }

    function doVent() {
      if (G.sectors.lab !== "OVERHEAT") {
        print(stamp() + "  LAB REACTOR WITHIN TOLERANCE. VENTING WOULD BLEED HEAT.", "res");
        return;
      }
      if (!checkCost(VENT_COST)) return;
      setSector("lab", "OK");
      print(stamp() + "  VENT CYCLE DONE — LAB REACTOR BACK BELOW 80%", "good");
    }

    function doBroadcast() {
      if (!checkCost(BROADCAST_COST)) return;
      G.calm += 14;
      print(stamp() + "  BROADCAST ON AIR — \u201CTHE SHIFT HOLDS. THE LIGHT HOLDS.\u201D TENSION EASING.", "good");
    }

    function showHelp() {
      const lines = [
        "AVAILABLE COMMANDS",
        "  STATUS — show grid, meters, sectors",
        "  ROUTE POWER <REF|LAB|DWL|OUT> — restore a dark sector (12 PWR)",
        "  SEND RESCUE <REF|LAB|DWL|OUT> — seal an active breach (15 PWR)",
        "  VENT CORE — cool the lab reactor (8 PWR)",
        "  BROADCAST — settle the dwelling (10 PWR)",
        "  NEXT — advance to the next report now",
        "  HELP — this page",
      ];
      lines.forEach((l) => print(l, "sys"));
    }

    function showStatus() {
      print(stamp() + "  GRID STATUS", "sys");
      SECTORS.forEach((s) => {
        const st = G.sectors[s.id];
        print("   " + s.code + " " + s.name.padEnd(14) + "  [" + st + "]", st === "OK" ? "sys" : "res");
      });
      print("   POWER " + String(clamp(G.power)).padStart(3) + "   HEAT " + String(clamp(G.heat)).padStart(3) + "   CALM " + String(clamp(G.calm)).padStart(3), "sys");
    }

    function parseSector(parts) {
      for (const p of parts) {
        if (SECTOR_ALIASES[p]) return SECTOR_ALIASES[p];
      }
      return null;
    }

    function runCmd(raw) {
      const text = String(raw).trim();
      if (!text) return;
      print("OPERATOR> " + text, "me");
      G.actions += 1;
      const parts = text.toUpperCase().replace(/\s+/g, " ").trim().split(" ");
      const head = parts[0];

      if (head === "HELP") { showHelp(); return; }
      if (head === "STATUS" || head === "SCAN") { showStatus(); return; }

      if (head === "ROUTE" || head === "REPAIR") {
        const id = parseSector(parts);
        if (!id) {
          print(stamp() + "  MALFORMED — ROUTE POWER <REF|LAB|DWL|OUT>", "err");
          return;
        }
        doPower(id);
        render();
        checkDefeat();
        return;
      }

      if (head === "SEND" || head === "RESCUE") {
        const id = parseSector(parts);
        if (!id) {
          print(stamp() + "  MALFORMED — SEND RESCUE <REF|LAB|DWL|OUT>", "err");
          return;
        }
        doRescue(id);
        render();
        checkDefeat();
        return;
      }

      if (head === "VENT") {
        doVent();
        render();
        checkDefeat();
        return;
      }

      if (head === "BROADCAST") {
        doBroadcast();
        render();
        checkDefeat();
        return;
      }

      if (head === "NEXT") {
        endTurn();
        return;
      }

      print(stamp() + "  COMMAND NOT RECOGNISED. TYPE HELP.", "err");
    }

    function statsText() {
      const t = G.endedAt || Date.now();
      const secs = Math.max(1, Math.round((t - G.startedAt) / 1000));
      const mm = Math.floor(secs / 60);
      const ss = String(secs % 60).padStart(2, "0");
      return "CMDs " + G.actions + "  ·  INCIDENTS " + G.incidents + "  ·  SHIFTS " + Math.min(G.turn, MAX_TURN) + "/" + MAX_TURN + "  ·  PWR " + clamp(G.power) + " / HT " + clamp(G.heat) + " / CL " + clamp(G.calm) + "  ·  TIME " + mm + ":" + ss;
    }

    function victory() {
      G.over = true;
      G.endedAt = Date.now();
      if (turnTimer) clearTimeout(turnTimer);
      print("", "div");
      print(clockStr() + "  RELIEF CONVOY ON THE TUNDRA ROAD. HEADLIGHTS. VOICES. THE DOOR OPENS.", "head");
      ovTitle.textContent = "DAWN AT K-7";
      ovTitle.classList.remove("lose");
      ovSub.textContent = "The convoy reads the board: lights on, reactor stable, no missing names. Somebody kept the station alive while the gale howled outside. The record says \u201Cthe shift held.\u201D";
      ovStats.textContent = statsText();
      overlay.classList.remove("hidden");
    }

    function defeat(title, flavor) {
      G.over = true;
      G.endedAt = Date.now();
      if (turnTimer) clearTimeout(turnTimer);
      print("", "div");
      print(clockStr() + "  " + title + " — OPERATOR CONSOLE GOING DARK.", "err");
      ovTitle.textContent = title;
      ovTitle.classList.add("lose");
      ovSub.textContent = flavor;
      ovStats.textContent = statsText();
      overlay.classList.remove("hidden");
      render();
    }

    function boot() {
      const lines = [
        "K-7 POLARNA STATION — TELETYPE OPERATOR CONSOLE",
        "GRID: CLOSED NETWORK · CLEARANCE: LEVEL 2 SHIFT",
        "23:20 — the previous operator hands over the stamp, the log, the silence.",
        "The relief convoy is due at first light. Keep the light on.",
        "TYPE HELP FOR THE COMMAND REFERENCE.",
      ];
      lines.forEach((l) => print(l, "sys"));
      print("", "div");
    }

    cmdEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (!G || !G.over) runCmd(cmdEl.value);
        cmdEl.value = "";
      }
    });

    cmdEl.addEventListener("input", () => {
      if (G && G.over) {
        overlay.classList.add("hidden");
      }
    });

    document.getElementById("ov-btn").addEventListener("click", reset);

    reset();
  </script>
</body>
</html>
