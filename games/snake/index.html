<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake · Qwen Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23111'/></svg>">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111111;
      --muted: #777777;
      --line: #e5e5e5;
      --food: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 24px 16px 0;
    }

    header a {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    header a:hover { color: var(--fg); }

    h1 { font-size: 20px; font-weight: 600; }

    main {
      width: 100%;
      max-width: 560px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .score {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .score b {
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      width: min(480px, 100%);
      aspect-ratio: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(250, 250, 250, 0.85);
      border-radius: 8px;
      text-align: center;
      padding: 16px;
    }

    .overlay.hidden { display: none; }

    .overlay .title { font-size: 18px; font-weight: 600; }
    .overlay .sub { font-size: 13px; color: var(--muted); }

    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../">&larr; All games</a>
    <h1>Snake</h1>
  </header>

  <main>
    <div class="score">
      <span>Score <b id="score">0</b></span>
      <span>Best <b id="best">0</b></span>
    </div>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay hidden" id="overlay">
        <div class="title" id="ov-title"></div>
        <div class="sub" id="ov-sub"></div>
      </div>
    </div>

    <p class="hint">Arrows / WASD to move &middot; Space to pause &middot; Swipe on touch</p>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ov-title");
    const ovSub = document.getElementById("ov-sub");

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const BEST_KEY = "qwen-arcade-snake-best";

    let snake, dir, queued, food, score, alive, paused, tickMs, acc, lastFrame;

    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = { x: 1, y: 0 };
      queued = [];
      score = 0;
      alive = true;
      paused = false;
      tickMs = 120;
      acc = 0;
      lastFrame = performance.now();
      scoreEl.textContent = "0";
      placeFood();
      overlay.classList.add("hidden");
      draw();
    }

    function placeFood() {
      const taken = new Set(snake.map((s) => s.x + "," + s.y));
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (!taken.has(x + "," + y)) free.push({ x, y });
        }
      }
      food = free[Math.floor(Math.random() * free.length)];
    }

    function step() {
      if (queued.length) dir = queued.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
      const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        tickMs = Math.max(60, tickMs - 2);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      alive = false;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
        bestEl.textContent = best;
      }
      ovTitle.textContent = "Game over";
      ovSub.textContent = "Score " + score + " — press Space or tap to play again";
      overlay.classList.remove("hidden");
    }

    function togglePause() {
      if (!alive) return;
      paused = !paused;
      if (paused) {
        ovTitle.textContent = "Paused";
        ovSub.textContent = "Press Space or tap to resume";
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
      lastFrame = performance.now();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#f1f1f1";
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL + 0.5, 0);
        ctx.lineTo(i * CELL + 0.5, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL + 0.5);
        ctx.lineTo(canvas.width, i * CELL + 0.5);
        ctx.stroke();
      }

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#18181b";
      for (let i = 0; i < snake.length; i++) {
        const pad = i === 0 ? 1.5 : 2.5;
        roundRect(
          snake[i].x * CELL + pad,
          snake[i].y * CELL + pad,
          CELL - pad * 2,
          CELL - pad * 2,
          5
        );
        ctx.fill();
      }
    }

    function frame(now) {
      if (alive && !paused) {
        acc += now - lastFrame;
        while (alive && acc >= tickMs) {
          acc -= tickMs;
          step();
          if (alive) draw();
        }
      }
      lastFrame = now;
      requestAnimationFrame(frame);
    }

    const DIRS = {
      ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
    };

    function pushDir(d) {
      if (!alive) reset();
      const last = queued.length ? queued[queued.length - 1] : dir;
      if (d.x === -last.x && d.y === -last.y) return;
      if (d.x === last.x && d.y === last.y) return;
      if (queued.length < 3) queued.push(d);
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (alive) togglePause();
        else reset();
        return;
      }
      const d = DIRS[e.code];
      if (!d) return;
      e.preventDefault();
      if (!alive) reset();
      pushDir(d);
    });

    overlay.addEventListener("click", () => {
      if (alive) togglePause();
      else reset();
    });

    let touchStart = null;
    window.addEventListener("touchstart", (e) => {
      touchStart = e.touches[0];
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.clientX;
      const dy = t.clientY - touchStart.clientY;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) {
        if (!alive) reset();
        return;
      }
      const d = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };
      if (!alive) reset();
      pushDir(d);
    });

    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
