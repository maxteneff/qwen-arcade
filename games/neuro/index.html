<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neurolinguist: First Contact · Qwen Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23111'/></svg>">
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #16161a;
      --muted: #6f6f78;
      --line: #e2e0d8;
      --card: #ffffff;
      --accent: #31479e;
      --ok: #2c6e3f;
      --warn: #a3541e;
      --crit: #9c2b2b;
      --token: #274b77;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 980px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 24px 16px 0;
    }

    header a { color: var(--muted); font-size: 14px; text-decoration: none; }
    header a:hover { color: var(--fg); }
    h1 { font-size: 20px; font-weight: 600; }

    main {
      width: 100%;
      max-width: 980px;
      padding: 14px 16px 32px;
      display: grid;
      grid-template-columns: 230px 1fr 240px;
      gap: 14px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .card h2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 10px 14px 0;
      user-select: none;
    }

    .panel .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 7px 14px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel .row:last-child { border-bottom: none; }
    .panel .row .k { color: var(--muted); }
    .panel .row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .v.ok { color: var(--ok); }
    .v.warn { color: var(--warn); }
    .v.crit { color: var(--crit); }

    .terminal {
      padding: 0 0 14px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .terminal .head {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px 8px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      user-select: none;
    }

    #log {
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      max-height: 460px;
    }

    .beat { margin-bottom: 18px; }

    .ctx {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .ctx .sys { color: var(--fg); font-weight: 600; }

    .msgline { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 6px; }

    .token {
      font: 600 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.14em;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px dashed #b9c2d2;
      background: #f2f5fa;
      color: var(--token);
      cursor: pointer;
      text-transform: lowercase;
    }

    .token:hover { border-style: solid; }

    .token.bound {
      border-style: solid;
      border-color: var(--token);
      background: #e3eaf5;
    }

    .sends {
      font: 12px ui-monospace, monospace;
      color: var(--ok);
      margin-top: 4px;
    }

    .sends.deny { color: var(--crit); }

    .actions {
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
    }

    .options { display: flex; flex-direction: column; gap: 8px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf8;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .opt:hover { border-color: var(--accent); }

    .opt .toks {
      font: 600 14px ui-monospace, monospace;
      letter-spacing: 0.1em;
      color: var(--token);
      white-space: nowrap;
    }

    .opt .tr { font-size: 12px; color: var(--muted); }

    .go {
      display: block;
      width: 100%;
      padding: 10px;
      font: 600 13px system-ui, sans-serif;
      letter-spacing: 0.04em;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .go:disabled { opacity: 0.5; cursor: default; }

    .dict { padding-bottom: 6px; }

    .dict .item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
    }

    .dict .item:last-child { border-bottom: none; }
    .dict .t { font-family: ui-monospace, monospace; letter-spacing: 0.1em; color: var(--token); font-weight: 600; }
    .dict .m { color: var(--muted); text-align: right; }
    .dict .empty { color: #b4b2ab; padding: 8px 14px; font-size: 12px; }

    .hint { font-size: 11.5px; color: var(--muted); padding: 8px 14px 12px; border-top: 1px solid var(--line); line-height: 1.5; }

    .guess {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(30, 40, 80, 0.18);
      z-index: 5;
    }

    .guess.hidden { display: none; }

    .guess .gt {
      font: 600 15px ui-monospace, monospace;
      letter-spacing: 0.12em;
      color: var(--token);
      margin-bottom: 2px;
    }

    .guess .gc { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

    .gopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .gopt {
      padding: 8px 10px;
      font: 12.5px system-ui, sans-serif;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfaf8;
      cursor: pointer;
      color: inherit;
      text-align: left;
    }

    .gopt:hover { border-color: var(--accent); }
    .gopt.cur { border-color: var(--accent); background: #eef2fb; font-weight: 600; }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(246, 245, 242, 0.94);
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    .overlay.hidden { display: none; }
    .overlay .big { font-size: 24px; font-weight: 700; max-width: 560px; }
    .overlay .sub { font-size: 14px; color: var(--muted); max-width: 520px; line-height: 1.6; }
    .overlay .stats {
      font: 12px ui-monospace, monospace;
      color: #55524b;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 16px;
    }
    .overlay button {
      font: 600 13px system-ui, sans-serif;
      padding: 10px 26px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .panel { order: 2; }
      .terminal { order: 1; min-height: 0; }
      .dict { order: 3; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../">&larr; All games</a>
    <h1>Neurolinguist: First Contact</h1>
  </header>

  <main>
    <section class="card panel">
      <h2>SHIP STATUS</h2>
      <div id="panel"></div>
      <div class="hint" id="panel-note">Telemetry of the unknown vessel. Context is the only teacher you have.</div>
    </section>

    <section class="card terminal">
      <div class="head">
        <span>DEEP SPACE COMMS — BAND 7</span>
        <span id="prog">CONTACT 1</span>
      </div>
      <div id="log"></div>
      <div class="actions" id="actions"></div>
      <div class="guess hidden" id="guess"></div>
    </section>

    <section class="card dict">
      <h2>YOUR DICTIONARY</h2>
      <div id="dictlist"></div>
      <div class="hint">Click any glyph in the log to bind — or re-bind — a meaning. Your calls are never confirmed.</div>
    </section>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="big" id="ov-title"></div>
    <div class="sub" id="ov-sub"></div>
    <div class="stats" id="ov-stats"></div>
    <button id="ov-btn">RE-ESTABLISH CONTACT</button>
  </div>

  <script>
    "use strict";

    const VOCAB = {
      ssai: { en: "greeting", opts: ["greeting", "question", "warning", "farewell"] },
      vre: { en: "reactor", opts: ["reactor", "planet", "engine", "treaty"] },
      lok: { en: "hot", opts: ["hot", "cold", "fast", "far"] },
      ra: { en: "cold", opts: ["cold", "hot", "metal", "dirt"] },
      kzo: { en: "danger", opts: ["danger", "shelter", "guest", "harvest"] },
      wee: { en: "we", opts: ["we", "you", "they", "vessel"] },
      mee: { en: "you", opts: ["you", "we", "they", "vessel"] },
      pei: { en: "peaceful · friend", opts: ["peaceful · friend", "weapon", "fuel", "hull"] },
      krr: { en: "weapon", opts: ["weapon", "peaceful · friend", "fuel", "hull"] },
      oon: { en: "stay", opts: ["stay", "leave", "arrive", "break"] },
      aah: { en: "leave", opts: ["leave", "stay", "arrive", "break"] },
      lum: { en: "light · energy", opts: ["light · energy", "water", "gravity", "name"] },
    };

    const BEATS = [
      {
        type: "say",
        msg: ["ssai"],
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["STANDBY", "ok"], Comms: ["PULSE", "warn"] },
        context: "An unknown vessel slips out of the ecliptic and holds station 400 km off your bow. It emits a slow, regular light signature — one token, repeated, unhurried. It is not in a hurry.",
      },
      {
        type: "say",
        msg: ["vre", "lok"],
        panel: { Core: ["412 K ▲", "crit"], Weapons: ["COLD", "ok"], Drives: ["STANDBY", "ok"], Comms: ["ACTIVE", "warn"] },
        context: "SENSOR: their reactor feed spikes to 412 K and climbs. The pulse hardens into two sharp flashes, then settles. The message arrives right after the spike, as if to report it.",
      },
      {
        type: "say",
        msg: ["ra", "kzo"],
        panel: { Core: ["388 K ▼", "warn"], Weapons: ["ELEVATED", "warn"], Drives: ["STANDBY", "ok"], Comms: ["ACTIVE", "ok"] },
        context: "SENSOR: a coolant line ruptures across their ship — a near miss at your hull, logged on their bridge as hostile. The core dumps heat fast, and two new tokens land exactly when the alarm clears.",
      },
      {
        type: "say",
        msg: ["wee", "mee"],
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["ALIGNED", "warn"], Comms: ["FORMAL", "warn"] },
        context: "The vessel swings its drive axis to point at your hull and holds it there, steady. A formal address — two tokens, clearly about the two of you. Who is which?",
      },
      {
        type: "say",
        msg: ["pei", "krr"],
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["ALIGNED", "ok"], Comms: ["FORMAL", "ok"] },
        context: "SENSOR: their weapon rail reads COLD. The hailing continues, steady and patient. Two tokens, mirror-weight — one of them means a friend. The other means its opposite. Decide carefully.",
      },
      {
        type: "choose", id: "r1",
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["ALIGNED", "warn"], Comms: ["WAITING", "warn"] },
        context: "The alien holds the axis, weapons cold, and waits. Mission control insists on a first statement of intent before any protocol is invoked. Pick the transmission.",
        options: [
          { tokens: ["wee", "pei"] },
          { tokens: ["wee", "krr"] },
          { tokens: ["ssai", "ssai"] },
        ],
        correct: 0,
        fail: "Your transmission decodes as \u201CWE ARE WEAPON\u201D. Their bridge takes it in 0.4 seconds. The rail spins up, the reactor vents — and the window that was never meant to close, closes.",
      },
      {
        type: "say",
        msg: ["oon", "ra"],
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["EASED", "ok"], Comms: ["WARM", "ok"] },
        context: "Their core settles below nominal and the attitude relaxes by two degrees. A second overture — an invitation to linger in their cold, or a warning learned from their own near-miss. One new token.",
      },
      {
        type: "say",
        msg: ["aah", "lum"],
        panel: { Core: ["LOW", "warn"], Weapons: ["COLD", "ok"], Drives: ["SPIN-UP", "crit"], Comms: ["FADE", "warn"] },
        context: "They route power to the jump drive and dim their hull lights almost to nothing. A farewell — or an order addressed to both of you. Watch which lights they choose to keep.",
      },
      {
        type: "choose", id: "r2",
        panel: { Core: ["LOW", "ok"], Weapons: ["COLD", "ok"], Drives: ["SPIN-UP", "warn"], Comms: ["WINDOW 90S", "crit"] },
        context: "DIPLOMATIC WINDOW OPEN — 90 SECONDS. The alien repeats aah · lum and waits for your intent. Mission note from control: the sector scan is not finished. You cannot be the one to leave.",
        options: [
          { tokens: ["wee", "aah"] },
          { tokens: ["mee", "oon"] },
          { tokens: ["kzo", "lok"] },
        ],
        correct: 1,
        fail: "They hear \u201CWE LEAVE\u201D. The diplomatic window folds shut without ceremony. Jump light blooms off their bow — departure, not threat, and now no one is left to talk to.",
      },
      {
        type: "choose", id: "r3",
        panel: { Core: ["NOMINAL", "ok"], Weapons: ["COLD", "ok"], Drives: ["STANDBY", "ok"], Comms: ["HANDSHAKE", "warn"] },
        context: "The final handshake. One transmission, and the channel becomes a treaty — or dies. Choose the last line carefully. There will be no second time.",
        options: [
          { tokens: ["wee", "krr", "aah"] },
          { tokens: ["ssai", "wee", "pei", "oon"] },
          { tokens: ["ra", "kzo", "kzo"] },
        ],
        correct: 1,
        fail: "The final line misfires mid-pulse. The channel dies. The treaty — and a first contact this species would have told its children about — is never relearned.",
      },
    ];

    let S;

    const panelEl = document.getElementById("panel");
    const logEl = document.getElementById("log");
    const actionsEl = document.getElementById("actions");
    const dictEl = document.getElementById("dictlist");
    const guessEl = document.getElementById("guess");
    const progEl = document.getElementById("prog");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ov-title");
    const ovSub = document.getElementById("ov-sub");
    const ovStats = document.getElementById("ov-stats");

    function reset() {
      S = {
        beat: 0,
        dict: {},
        guesses: 0,
        ok: 0,
        over: false,
        choices: {},
        started: Date.now(),
        endedAt: 0,
      };
      overlay.classList.add("hidden");
      guessEl.classList.add("hidden");
      renderAll();
    }

    function encountered() {
      const seen = [];
      const has = (t) => !seen.includes(t);
      for (let i = 0; i <= S.beat && i < BEATS.length; i++) {
        const b = BEATS[i];
        if (b.msg) b.msg.forEach((t) => has(t) && seen.push(t));
        if (b.options) b.options.forEach((o) => o.tokens.forEach((t) => has(t) && seen.push(t)));
      }
      return seen;
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function trans(tokens) {
      return tokens.map((t) => (S.dict[t] ? S.dict[t] : "?")).join(" ");
    }

    function tokenBtn(t) {
      const b = document.createElement("button");
      b.className = "token" + (S.dict[t] ? " bound" : "");
      b.textContent = t;
      b.addEventListener("click", () => openGuess(t));
      return b;
    }

    function renderPanel() {
      const b = BEATS[Math.min(S.beat, BEATS.length - 1)];
      panelEl.innerHTML = "";
      for (const k of Object.keys(b.panel)) {
        const [v, c] = b.panel[k];
        const row = document.createElement("div");
        row.className = "row";
        const kk = document.createElement("span");
        kk.className = "k";
        kk.textContent = k;
        const vv = document.createElement("span");
        vv.className = "v " + c;
        vv.textContent = v;
        row.append(kk, vv);
        panelEl.appendChild(row);
      }
    }

    function beatBlock(b, done) {
      const el = document.createElement("div");
      el.className = "beat";
      const ctx = document.createElement("div");
      ctx.className = "ctx";
      ctx.innerHTML = "<span class='sys'>&#9646;</span> " + esc(b.context);
      const msg = document.createElement("div");
      msg.className = "msgline";
      (b.msg || []).forEach((t) => msg.appendChild(tokenBtn(t)));
      if (b.type === "choose" && done && S.choices[b.id] !== undefined) {
        const sd = document.createElement("div");
        sd.className = "sends";
        sd.textContent = "YOU SEND: [" + b.options[S.choices[b.id]].tokens.join(" · ") + "] — ACCEPTED";
        el.append(ctx, msg, sd);
      } else {
        el.append(ctx, msg);
      }
      return el;
    }

    function renderLog() {
      logEl.innerHTML = "";
      for (let i = 0; i < S.beat && i < BEATS.length; i++) {
        logEl.appendChild(beatBlock(BEATS[i], true));
      }
      if (S.beat < BEATS.length) {
        logEl.appendChild(beatBlock(BEATS[S.beat], false));
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function renderActions() {
      actionsEl.innerHTML = "";
      if (S.over) return;
      const b = BEATS[S.beat];
      if (b.type === "say") {
        const btn = document.createElement("button");
        btn.className = "go";
        btn.textContent = "TRANSMIT ACKNOWLEDGEMENT \u203A";
        btn.addEventListener("click", () => {
          guessEl.classList.add("hidden");
          S.beat += 1;
          renderAll();
        });
        actionsEl.appendChild(btn);
      } else {
        const box = document.createElement("div");
        box.className = "options";
        b.options.forEach((o, i) => {
          const btn = document.createElement("button");
          btn.className = "opt";
          const tk = document.createElement("span");
          tk.className = "toks";
          tk.textContent = o.tokens.join(" · ");
          const tr = document.createElement("span");
          tr.className = "tr";
          tr.textContent = "\u2192 " + trans(o.tokens);
          btn.append(tk, tr);
          btn.addEventListener("click", () => choose(i));
          box.appendChild(btn);
        });
        actionsEl.appendChild(box);
      }
      progEl.textContent = "CONTACT " + (S.beat + 1) + " / " + BEATS.length;
    }

    function renderDict() {
      dictEl.innerHTML = "";
      const seen = encountered();
      if (!seen.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "No glyphs yet.";
        dictEl.appendChild(e);
        return;
      }
      seen.forEach((t) => {
        const row = document.createElement("div");
        row.className = "item";
        const tk = document.createElement("span");
        tk.className = "t";
        tk.textContent = t;
        const m = document.createElement("span");
        m.className = "m";
        m.textContent = S.dict[t] || "— unbound";
        row.append(tk, m);
        dictEl.appendChild(row);
      });
    }

    function renderAll() {
      renderPanel();
      renderLog();
      renderActions();
      renderDict();
    }

    function openGuess(t) {
      const v = VOCAB[t];
      guessEl.innerHTML = "";
      const gt = document.createElement("div");
      gt.className = "gt";
      gt.textContent = t + " —";
      const gc = document.createElement("div");
      gc.className = "gc";
      gc.textContent = S.dict[t] ? ("current binding: \u201C" + S.dict[t] + "\u201D — re-bind if the context says otherwise") : "bind a meaning. Context is the only teacher.";
      const box = document.createElement("div");
      box.className = "gopts";
      v.opts.forEach((label) => {
        const b = document.createElement("button");
        b.className = "gopt" + (S.dict[t] === label ? " cur" : "");
        b.textContent = label;
        b.addEventListener("click", () => {
          S.dict[t] = label;
          S.guesses += 1;
          guessEl.classList.add("hidden");
          renderAll();
        });
        box.appendChild(b);
      });
      guessEl.append(gt, gc, box);
      guessEl.classList.remove("hidden");
    }

    function choose(i) {
      const b = BEATS[S.beat];
      if (b.type !== "choose") return;
      if (i === b.correct) {
        S.choices[b.id] = i;
        S.ok += 1;
        guessEl.classList.add("hidden");
        S.beat += 1;
        if (S.beat >= BEATS.length) {
          win();
          return;
        }
        renderAll();
      } else {
        gameOver(b.fail);
      }
    }

    function statsText() {
      const t = S.endedAt || Date.now();
      const secs = Math.max(1, Math.round((t - S.started) / 1000));
      const mm = Math.floor(secs / 60);
      const ss = String(secs % 60).padStart(2, "0");
      return "TOKENS BOUND " + Object.keys(S.dict).length + "  ·  GUESSES " + S.guesses + "  ·  CONTACTS HELD " + S.ok + "  ·  TIME " + mm + ":" + ss;
    }

    function win() {
      S.over = true;
      S.endedAt = Date.now();
      ovTitle.textContent = "FIRST CONTACT ACHIEVED";
      ovSub.textContent = "The treaty channel opens into white static — and then into a word you finally understand: ssai. Hello. The session is archived in their records under \u201Cthe one who listened\u201D.";
      ovStats.textContent = statsText();
      overlay.classList.remove("hidden");
    }

    function gameOver(flavor) {
      S.over = true;
      S.endedAt = Date.now();
      ovTitle.textContent = "CONTACT LOST";
      ovSub.textContent = flavor;
      ovStats.textContent = statsText();
      overlay.classList.remove("hidden");
    }

    document.getElementById("ov-btn").addEventListener("click", reset);

    reset();
  </script>
</body>
</html>
